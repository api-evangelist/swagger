# Vendor facets — Swagger (SmartBear). Swagger UI (the open-source reference renderer with
# try-it-out), Swagger Codegen (client SDKs in 40+ languages) and the commercial API Hub /
# Swagger Studio + Portal (design, Spectral style guides, mocks, a generated MCP server project,
# branded portals). The lift is classic developer ergonomics — a console, SDKs, a portal — plus a
# ruleset route into governance. It ships almost none of the agent-discovery surface the newer docs
# platforms serve by default: the SmartBear portal probed serves no llms.txt, api-catalog or card.
vendor: swagger
name: Swagger
website: https://swagger.io
areas:
- documentation
- sdk-generation
registry_keys:
- swagger-ui
rubric_schema_version: 0.22.0
generated: '2026-09-25'
features_refreshed: '2026-09-25'
basis: capability
summary: >-
  Swagger's lift is the older developer-ergonomics kit: Swagger UI's try-it-out console and reference,
  Codegen client SDKs that earn sdk_count_1 and sdk_count_3 once the provider publishes them, and a Portal
  that earns portal and documentation pointers. Swagger Studio's Spectral style guides can earn rules_present,
  but only if the provider publishes the ruleset outside its private organisation. The largest gap is
  agent readiness: no llms.txt, api-catalog, skills or agent card on the portal, and the MCP option is
  a generated Node project the provider must host itself, so it grades `templated` at best. Only the Swagger
  UI detection key exists, so customers of the commercial products are not measurable from the catalog.
features:
- id: swagger-ui
  name: Swagger UI
  description: Open-source reference renderer for Swagger 2.0 and OpenAPI 3.x with try-it-out on every
    operation.
  source: https://swagger.io/tools/swagger-ui/
  tier: open-source
- id: swagger-codegen
  name: Swagger Codegen
  description: Generates client SDKs in over 40 languages and server stubs in over 20 from an OpenAPI
    definition.
  source: https://swagger.io/tools/swagger-codegen/
  tier: open-source
- id: portal
  name: Swagger Portal (API Hub Portal)
  description: >-
    Branded public or private portals synced from Studio definitions, with custom domains, IdP authentication
    and a central API catalog.
  source: https://swagger.io/product/portal/
  tier: unknown
- id: style-guides
  name: Spectral style guides in Swagger Studio
  description: >-
    Import Spectral rulesets as organisation style guides, edit and test them in a Spectral Ruleset Editor,
    and lint definitions against them.
  source: https://support.smartbear.com/swagger/studio/docs/en/what-s-new.html
  tier: unknown
- id: mcp-generator
  name: Generate MCP Server
  description: >-
    Generates a Node.js MCP server project (mcp-server.zip) from an OpenAPI 2.0/3.0/3.1 definition for
    the provider to install and host.
  source: https://support.smartbear.com/swagger/studio/docs/en/manage-apis/generating-mcp-server.html
  tier: unknown
- id: mock-servers
  name: Automated mock APIs
  description: Generates mock servers from a definition to test endpoints without a backend.
  source: https://swagger.io/tools/swaggerhub/
  tier: unknown
- id: studio-design
  name: Swagger Studio design with OpenAPI 3.2 support
  description: >-
    Collaborative design and hosting of API definitions, supporting OpenAPI 3.2 since March 2026, with
    AI-assisted generation.
  source: https://support.smartbear.com/swagger/studio/docs/en/what-s-new.html
  tier: unknown
maps:
- feature: swagger-ui
  check: console_or_sandbox
  layer: composite
  provider_must: Host Swagger UI (or the portal) against real or mock servers and declare it as a Console
    pointer.
  catalog_pass_rate: 0.089
  facet: developer_ergonomics
  points: 3
  baseline_pass_rate: 0.332
- feature: swagger-ui
  check: api_reference_present
  layer: composite
  provider_must: Host the rendered reference and declare it as an APIReference pointer.
  catalog_pass_rate: 0.222
  facet: developer_ergonomics
  points: 3
  baseline_pass_rate: 0.942
  saturated: true
  saturated_note: >-
    94% of providers with a contract, docs and a reference already earn this; the vendor cannot move it
    for most of its buyers.
- feature: swagger-codegen
  check: sdk_count_1
  layer: composite
  provider_must: >-
    Publish at least one generated client to a public registry under its own name and declare it as an
    SDK pointer.
  catalog_pass_rate: 0.148
  facet: developer_ergonomics
  points: 3
  baseline_pass_rate: 0.413
- feature: swagger-codegen
  check: sdk_count_3
  layer: composite
  provider_must: Publish and maintain three or more generated clients and declare each.
  note: Codegen output is generic template code; the check counts published SDK pointers, not their quality.
  catalog_pass_rate: 0.018
  facet: developer_ergonomics
  points: 4
  baseline_pass_rate: 0.043
- feature: portal
  check: portal_present
  layer: composite
  provider_must: Declare the portal as a DeveloperPortal pointer.
  catalog_pass_rate: 0.228
  facet: developer_ergonomics
  points: 4
  baseline_pass_rate: 0.633
- feature: portal
  check: documentation_present
  layer: composite
  provider_must: Declare the portal's guides as a Documentation pointer.
  catalog_pass_rate: 0.453
  facet: developer_ergonomics
  points: 4
  baseline_pass_rate: 0.95
  saturated: true
  saturated_note: >-
    95% of providers with a contract, docs and a reference already earn this; the vendor cannot move it
    for most of its buyers.
- feature: style-guides
  check: rules_present
  layer: composite
  provider_must: >-
    Export the organisation's Spectral style guide and publish it where the harvest can read it (public
    repo or URL declared in apis.json); a style guide inside Studio is private.
  catalog_pass_rate: 0.006
  facet: contract_governance
  points: 10
  baseline_pass_rate: 0.063
- feature: mcp-generator
  check: mcp_server
  layer: agent_readiness
  grade: templated
  provider_must: Deploy the generated project on its own host and register it; the zip on a laptop is
    not a server.
  note: >-
    Generated from one SmartBear template, so `templated` (0.6 of 12). Deployed on the provider's domain
    and passing the live probe it could grade higher; that is the provider's work, not the generator's.
  points: 12
  baseline_pass_rate: 0.22
- feature: studio-design
  check: contract_present
  layer: composite
  conditional: true
  condition: Only for a provider with no published contract that designs one in Studio and publishes it
    publicly.
  creates_artifact: true
  catalog_pass_rate: 0.31
  facet: contract_quality
  points: 20
  baseline_pass_rate: 0.949
  saturated: true
  saturated_note: >-
    95% of providers with a contract, docs and a reference already earn this; the vendor cannot move it
    for most of its buyers.
earns_nothing:
- feature: portal
  check: llms_txt_published
  why: The SmartBear portal probed on 2026-09-25 returns 404 for /llms.txt; no Portal page claims one.
- feature: portal
  check: well_known_published
  why: The same portal returns 404 for /.well-known/api-catalog; no well-known document is served.
- feature: mock-servers
  check: examples_present
  why: >-
    A mock returns examples the definition already holds or synthesises at runtime; it writes none into
    the contract.
out_of_reach:
  checks:
  - agent_skills
  - agent_card
  - well_known_catalog
  - change_log_present
  - cli_present
  - postman_present
  - status_page_present
  note: >-
    None of the Swagger products publishes skills, an agent card, an api-catalog, a changelog surface,
    a CLI for the provider's API or a Postman collection.
unscored_practice:
- feature: studio-design
  why: >-
    Native OpenAPI 3.2 authoring is scored only through openapi_3_2 on the published contract, not as
    a tooling capability.
- feature: mcp-generator
  why: >-
    MCP definitions managed as versioned API artifacts in Studio (July 2026) have no scored signal until
    deployed.
